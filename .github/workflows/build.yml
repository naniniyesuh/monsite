name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      sites:
        description: "Taranacak siteler (boşlukla ayrılmış)"
        required: false
        default: "alpp.studio example.com www.w3.org"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode sürümü
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          xcodebuild -version

      - name: Uygulamayı simülatör için derle
        run: |
          set -o pipefail
          xcodebuild build \
            -project MonSite.xcodeproj \
            -target MonSite \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Tarama motorunu komut satırı aracı olarak derle
        run: |
          swiftc -O -parse-as-library -o monsite-cli \
            MonSite/Models.swift MonSite/HTTPFetcher.swift MonSite/HTMLExtractor.swift \
            MonSite/PageInspector.swift MonSite/PageAnalyzer.swift MonSite/SecurityChecker.swift \
            MonSite/CertificateChecker.swift MonSite/RobotsSitemap.swift MonSite/SiteCrawler.swift \
            MonSite/Monitoring.swift Tools/cli/MonSiteCLI.swift

      - name: Ayrıştırıcı testleri
        run: ./monsite-cli --selftest

      - name: Gerçek sitelerde tarama
        continue-on-error: true
        run: ./monsite-cli ${{ github.event.inputs.sites || 'alpp.studio example.com www.w3.org' }} --pages 25 --depth 2 2>&1 | tee scan.log

      - name: Kayıtlar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            scan.log
