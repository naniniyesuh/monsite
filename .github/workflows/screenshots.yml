name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: ["v1.1"]

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Uygulamayı derle
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          set -o pipefail
          xcodebuild build -project MonSite.xcodeproj -target MonSite -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/sim" 2>&1 | tail -3

      - name: Simülatörde ekran görüntüleri ve tanıtım videosu
        run: |
          set -x
          mkdir -p shots
          SITE=alpp.studio
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import sys,json; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(r[-1]['identifier'])")
          UDID=$(xcrun simctl create shot "iPhone 16 Pro Max" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 --dataNetwork wifi
          xcrun simctl install "$UDID" build/sim/MonSite.app
          BID=studio.alpp.monsite
          L="-AppleLanguages (tr) -AppleLocale tr_TR"
          shot() { sleep "$2"; xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          fresh() { xcrun simctl terminate "$UDID" $BID || true; xcrun simctl uninstall "$UDID" $BID; xcrun simctl install "$UDID" build/sim/MonSite.app; }

          # 1) Giriş ekranı, adres yazılmış
          xcrun simctl launch "$UDID" $BID $L -MonSitePrefill $SITE; shot 01-giris 6
          # 2) Tarama sürerken (istekler yavaşlatılmış)
          fresh; xcrun simctl launch "$UDID" $BID $L -MonSiteAutoScan $SITE -MonSiteSlowDemo
          shot 02-tarama-a 3; shot 02-tarama-b 1.5; shot 02-tarama-c 1.5
          # 3) Rapor
          fresh; xcrun simctl launch "$UDID" $BID $L -MonSiteAutoScan $SITE; shot 03-rapor 25
          # 4) Gruplu sorun listesi (SEO alanı)
          fresh; xcrun simctl launch "$UDID" $BID $L -MonSiteAutoScan $SITE -MonSiteOpenArea seo; shot 04-sorunlar 25
          # 5) İzleme ayrıntısı: çalışırlık ve eğilim grafiği
          fresh; xcrun simctl launch "$UDID" $BID $L -MonSiteMonitorsTab -MonSiteDemoMonitor $SITE -MonSiteOpenMonitor; shot 05-izleme 45
          # 6) Rapor, koyu mod
          fresh; xcrun simctl ui "$UDID" appearance dark
          xcrun simctl launch "$UDID" $BID $L -MonSiteAutoScan $SITE; shot 06-rapor-koyu 25
          xcrun simctl ui "$UDID" appearance light

          # Tanıtım videosu (App Review için)
          fresh
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force shots/MonSite-demo.mp4 &
          REC=$!
          sleep 3
          xcrun simctl launch "$UDID" $BID $L -MonSiteDemoTour $SITE
          sleep 50
          kill -INT $REC; wait $REC || true
          ls -la shots

      - name: Görüntüleri screenshots dalına gönder
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Ekran görüntüleri ve tanıtım videosu ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
