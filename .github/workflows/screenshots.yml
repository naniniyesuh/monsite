name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    # Apple Silicon makinelerinde kuyruk uzun olabildiği için Intel makine kullanılıyor
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Uygulamayı derle
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          set -o pipefail
          xcodebuild build -project UpSite.xcodeproj -target UpSite -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/sim" 2>&1 | tail -3

      - name: Simülatörde ekran görüntüleri
        run: |
          set -x
          mkdir -p shots
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import sys,json; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(r[-1]['identifier'])")
          UDID=$(xcrun simctl create shot "iPhone 16 Pro Max" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 --dataNetwork wifi
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl install "$UDID" build/sim/UpSite.app
          BID=studio.alpp.monsite
          # İlk açılış CI'da yavaş olabiliyor
          xcrun simctl launch "$UDID" $BID -UpSiteDemo; sleep 20
          run() { # dil ad süre argümanlar...
            local lang=$1 name=$2 wait=$3; shift 3
            local loc=$([ $lang = tr ] && echo tr_TR || echo en_US)
            xcrun simctl terminate "$UDID" $BID || true; sleep 1
            xcrun simctl launch "$UDID" $BID -UpSiteDemo -language $lang -AppleLanguages "($lang)" -AppleLocale $loc "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/$lang-$name.png"
            # Simülatör bazen ekranı çizmeden görüntü alıyor (tamamen siyah): bir kez daha dene
            if python3 -c "import sys,zlib,struct; d=open(sys.argv[1],'rb').read(); print(len(d))" "shots/$lang-$name.png" | awk '{exit !($1 < 120000)}'; then
              echo "siyah görünüyor, tekrar: $lang-$name"
              xcrun simctl launchctl "$UDID" list >/dev/null 2>&1 || true
              pgrep -lf "UpSite" || echo "uygulama çalışmıyor (çökmüş olabilir)"
              sleep 10
              xcrun simctl io "$UDID" screenshot "shots/$lang-$name.png"
            fi
          }
          for lang in tr en; do
            run $lang 01-siteler 15
            run $lang 02-ayrinti 15 -UpSiteOpenSite d1
            run $lang 03-sertifikalar 15 -UpSiteTab certs
            run $lang 04-ayarlar 15 -UpSiteTab settings
            run $lang 05-ekle 15 -UpSiteAdd -UpSiteAddInterval 3
          done
          ls -la shots
          mkdir -p crash && cp ~/Library/Logs/DiagnosticReports/UpSite* crash/ 2>/dev/null || true
          ls crash

      - name: Çökme kayıtları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: crash
          if-no-files-found: ignore

      - name: Görüntüleri screenshots dalına gönder
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "UpSite ekran görüntüleri ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
