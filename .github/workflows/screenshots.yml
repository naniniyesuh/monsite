name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: ["v1.1"]

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Uygulamayı derle
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          set -o pipefail
          xcodebuild build -project MonSite.xcodeproj -target MonSite -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/sim" 2>&1 | tail -3

      - name: Simülatörde ekran görüntüleri
        run: |
          set -x
          mkdir -p shots
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import sys,json; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(r[-1]['identifier'])")
          UDID=$(xcrun simctl create shot "iPhone 16 Pro Max" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 --dataNetwork wifi
          xcrun simctl install "$UDID" build/sim/MonSite.app
          BID=studio.alpp.monsite
          L="-AppleLanguages (tr) -AppleLocale tr_TR"
          shot() { sleep "$2"; xcrun simctl io "$UDID" screenshot "shots/$1.png"; }

          xcrun simctl launch "$UDID" $BID $L; shot 01-giris 6
          xcrun simctl terminate "$UDID" $BID

          xcrun simctl launch "$UDID" $BID $L -MonSiteAutoScan alpp.studio; shot 02-tarama 3; shot 03-rapor 40
          xcrun simctl terminate "$UDID" $BID

          xcrun simctl launch "$UDID" $BID $L -MonSiteMonitorsTab -MonSiteDemoMonitor alpp.studio; shot 04-izleme 45
          xcrun simctl terminate "$UDID" $BID

          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl launch "$UDID" $BID $L -MonSiteAutoScan alpp.studio; shot 05-rapor-koyu 30
          ls -la shots

      - name: Görüntüleri screenshots dalına gönder
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.png
          git commit -q -m "Ekran görüntüleri ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
