name = "upsite-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Her 15 dakikada bir (saat başı, :15, :30, :45)
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "upsite"
# GitHub Actions dağıtımı bu değeri ilk kurulumda gerçek kimlikle değiştirir.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Kontrolleri gruplara bölüp paralel çalıştırmak için Worker kendini çağırır.
[[services]]
binding = "SELF"
service = "upsite-api"

[vars]
APNS_TOPIC = "studio.alpp.monsite"
MAX_SITES_PER_DEVICE = "50"
MAX_DEVICES = "500"
# Bu derleme numarasının altındaki uygulamalar "Güncelleme gerekli" ekranı gösterir (2.0.1 ve sonrası).
MIN_APP_BUILD = "4"
# Paket sınırları
MAX_SITES_PER_PACKAGE = "50"
MAX_PACKAGES_PER_DEVICE = "5"
MAX_MEMBERS = "20"
MAX_PACKAGES = "300"
# Yönetici ekranını görebilecek cihaz kimlikleri (virgülle). Kimlik tek başına yetki vermez; cihazın gizli anahtarı da gerekir.
ADMIN_DEVICE_IDS = ""

# Gizli değerler (wrangler secret put ile):
#   APNS_KEY      .p8 dosyasının içeriği
#   APNS_KEY_ID   Anahtar kimliği (10 karakter)
#   APNS_TEAM_ID  Apple geliştirici takım kimliği
#   INTERNAL_KEY  Worker'ın kendini çağırırken kullandığı rastgele anahtar
